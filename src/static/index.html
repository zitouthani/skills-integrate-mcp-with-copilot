<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div id="user-menu">
        <button id="user-icon" type="button" aria-label="Teacher account">👤</button>
        <div id="user-dropdown" class="hidden">
          <span id="user-status"></span>
          <button id="login-btn" type="button">Login</button>
          <button id="logout-btn" type="button" class="hidden">Logout</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <div id="login-modal" class="modal hidden">
      <form id="login-form" class="modal-content">
        <h3>Teacher Login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error hidden"></p>
        <button type="submit">Login</button>
        <button type="button" id="login-cancel">Cancel</button>
      </form>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Register a Student</h3>
        <p id="teacher-only-note"><em>Only logged-in teachers can register or unregister students.</em></p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
